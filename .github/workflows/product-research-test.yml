name: Product finder and research tests

on:
  push:
    paths:
      - 'worker/src/product-research.js'
      - 'worker/src/research-allegro.js'
      - 'worker/src/research-ranking-v3.js'
      - 'worker/src/index.js'
      - 'product-research.js'
      - 'product-finder.js'
      - 'catalog-lookup.js'
      - 'intake-core.js'
      - 'navigation.js'
      - 'enhancements.js'
      - 'index.html'
      - 'sw.js'
      - 'version.json'
      - 'tests/product-research.test.mjs'
      - 'tests/allegro-pagination.test.mjs'
      - 'tests/research-ranking-v3.test.mjs'
      - 'tests/allegro-api-v44.test.mjs'
      - 'tests/allegro-live-fixture-rerank.mjs'
      - 'tests/allegro-suggestion-offline.mjs'
      - 'tests/fixtures/allegro-live-v43-10.json'
      - 'tests/finder-allegro-v44.test.cjs'
      - 'tests/research-live.test.mjs'
      - 'tests/frontend-syntax.test.cjs'
      - '.github/workflows/product-research-test.yml'
  pull_request:
    paths:
      - 'worker/src/product-research.js'
      - 'worker/src/research-allegro.js'
      - 'worker/src/research-ranking-v3.js'
      - 'worker/src/index.js'
      - 'product-research.js'
      - 'product-finder.js'
      - 'catalog-lookup.js'
      - 'intake-core.js'
      - 'navigation.js'
      - 'enhancements.js'
      - 'index.html'
      - 'sw.js'
      - 'version.json'
      - 'tests/product-research.test.mjs'
      - 'tests/allegro-pagination.test.mjs'
      - 'tests/research-ranking-v3.test.mjs'
      - 'tests/allegro-api-v44.test.mjs'
      - 'tests/allegro-live-fixture-rerank.mjs'
      - 'tests/allegro-suggestion-offline.mjs'
      - 'tests/fixtures/allegro-live-v43-10.json'
      - 'tests/finder-allegro-v44.test.cjs'
      - 'tests/frontend-syntax.test.cjs'
      - '.github/workflows/product-research-test.yml'
  workflow_dispatch:

jobs:
  product-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test product research engine
        run: node tests/product-research.test.mjs
      - name: Test Allegro pagination and exact model recovery
        run: node tests/allegro-pagination.test.mjs
      - name: Test model and accessory ranking
        run: node tests/research-ranking-v3.test.mjs
      - name: Test Allegro API comparison and multiple candidates
        run: node tests/allegro-api-v44.test.mjs
      - name: Differential check on fifty real v43 catalog candidates
        run: node tests/allegro-live-fixture-rerank.mjs
      - name: Inspect recovery query suggestions from live fixture
        run: node tests/allegro-suggestion-offline.mjs
      - name: Test integrated Finder display and escaping
        run: node tests/finder-allegro-v44.test.cjs
      - name: Test frontend syntax and wiring
        run: node tests/frontend-syntax.test.cjs
      - name: Live production model research smoke test
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node tests/research-live.test.mjs
