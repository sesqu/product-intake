name: Product finder and research tests

on:
  push:
    paths:
      - 'worker/src/product-research.js'
      - 'worker/src/research-ranking-v3.js'
      - 'worker/src/research-allegro.js'
      - 'worker/wrangler.staging.jsonc'
      - 'tests/staging-isolation.test.mjs'
      - 'tests/staging-mpn-integration.test.mjs'
      - 'worker/src/index.js'
      - 'product-research.js'
      - 'product-finder.js'
      - 'catalog-lookup.js'
      - 'intake-core.js'
      - 'navigation.js'
      - 'enhancements.js'
      - 'index.html'
      - 'sw.js'
      - 'version.json'
      - 'tests/product-research.test.mjs'
      - 'tests/research-ranking-v3.test.mjs'
      - 'tests/research-live.test.mjs'
      - 'tests/frontend-syntax.test.cjs'
      - '.github/workflows/product-research-test.yml'
  pull_request:
    paths:
      - 'worker/src/product-research.js'
      - 'worker/src/research-ranking-v3.js'
      - 'worker/src/research-allegro.js'
      - 'worker/wrangler.staging.jsonc'
      - 'tests/staging-isolation.test.mjs'
      - 'tests/staging-mpn-integration.test.mjs'
      - 'worker/src/index.js'
      - 'product-research.js'
      - 'product-finder.js'
      - 'catalog-lookup.js'
      - 'intake-core.js'
      - 'navigation.js'
      - 'enhancements.js'
      - 'index.html'
      - 'sw.js'
      - 'version.json'
      - 'tests/product-research.test.mjs'
      - 'tests/research-ranking-v3.test.mjs'
      - 'tests/frontend-syntax.test.cjs'
      - '.github/workflows/product-research-test.yml'
  workflow_dispatch:

jobs:
  product-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test product research engine
        run: node tests/product-research.test.mjs
      - name: Test model-aware ranking v3
        run: node tests/research-ranking-v3.test.mjs
      - name: Test staging config, OAuth and API isolation
        run: node tests/staging-isolation.test.mjs
      - name: Test staged MPN API request plan end to end
        run: node tests/staging-mpn-integration.test.mjs
      - name: Test frontend syntax and wiring
        run: node tests/frontend-syntax.test.cjs
      - name: Live production model research smoke test
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node tests/research-live.test.mjs
