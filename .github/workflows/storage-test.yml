name: Frontend tests

on:
  push:
    paths:
      - 'index.html'
      - 'styles.css'
      - 'intake-core.js'
      - 'product-storage.js'
      - 'pwa-updates.js'
      - 'navigation.js'
      - 'cloud-products.js'
      - 'catalog-lookup.js'
      - 'modal.js'
      - 'secondary-views.js'
      - 'product-editor.js'
      - 'enhancements.js'
      - 'sw.js'
      - 'version.json'
      - 'tests/storage.test.cjs'
      - 'tests/frontend-syntax.test.cjs'
      - '.github/workflows/storage-test.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test product storage
        run: node tests/storage.test.cjs
      - name: Test frontend modules and PWA consistency
        run: node tests/frontend-syntax.test.cjs
