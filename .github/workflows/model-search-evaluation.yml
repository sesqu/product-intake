name: Model search evaluation

on:
  push:
    branches:
      - test/model-search-evaluation-20261016
    paths:
      - 'tests/model-search-evaluation.mjs'
      - '.github/workflows/model-search-evaluation.yml'
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Evaluate live model search
        run: node tests/model-search-evaluation.mjs
